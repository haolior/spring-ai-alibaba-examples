server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: practice
  datasource:
    url: jdbc:postgresql://192.168.10.108:5432/ai
    username: user_YPkESJ
    password: password_hpFWHH
  data:
    redis:
      host: 192.168.10.108
      database: 9
      password: redis-stack
      client-type: jedis
      port: 6389
  ai:
    chat:
      client:
        enabled: true
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
      embedding:
        options:
          model: text-embedding-v4
      rerank:
        options:
          model: qwen3-rerank
    memory:
      redis:
        enabled: true
        host: ${spring.data.redis.host}
        database: ${spring.data.redis.database}
        password: ${spring.data.redis.password}
        client-type: redisson
        port: ${spring.data.redis.port}
      postgresql:
        initialize-schema: true
        enabled: true
    vectorstore:
      redis:
        index-name: test-index
        prefix: "vector_store:"
        algorithm: HSNW
        metadata-fields:
          - name: source_id
            type: TAG
          - name: source_file
            type: TAG
          - name: category
            type: TAG
          - name: title
            type: TEXT
        initialize-schema: true

