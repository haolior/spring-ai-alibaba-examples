server:
  port: 8765
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: practice
  datasource:
    url: jdbc:mysql://192.168.7.24:3306/ai_practice?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: FmArM46TviIeoL
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.7.24
      database: 9
      password: redis8899
      client-type: jedis
      port: 6379
  ai:
    chat:
      client:
        enabled: true
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
      embedding:
        options:
          model: text-embedding-v4
      rerank:
        options:
          model: qwen3-rerank
    memory:
      redis:
        enabled: true
        host: ${spring.data.redis.host}
        database: ${spring.data.redis.database}
        password: ${spring.data.redis.password}
        client-type: redisson
        port: ${spring.data.redis.port}
      mysql:
        initialize-schema: true
        enabled: true
    vectorstore:
      redis:
        index-name: test-index
        prefix: "vector_store:"
        algorithm: HSNW
        metadata-fields:
          - name: source_id
            type: TAG
          - name: source_file
            type: TAG
          - name: category
            type: TAG
          - name: title
            type: TEXT
        initialize-schema: true

