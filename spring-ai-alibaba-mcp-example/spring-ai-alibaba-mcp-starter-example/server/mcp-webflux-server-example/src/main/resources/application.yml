# spring.main.web-application-type=none

# NOTE: You must disable the banner and the console logging 
# to allow the STDIO transport to work !!!
# Config reference: https://docs.spring.io/spring-ai/reference/api/mcp/mcp-server-boot-starter-docs.html#_webflux_server_configuration
server:
  port: 48080
spring:
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        enabled: true
        stdio: false
        name: my-weather-server
        type: ASYNC  # Recommended for reactive applications
        # 配置 sse 的根路径，默认值为 /sse
        # 下面的最终路径为 ip:port/weather/mcp
        protocol: sse
        sse-endpoint: /weather/sse  # 建立连接的端点（客户端也有，注意要保持一致）
        sse-message-endpoint: /weather/mcp  # 投送消息的端点（客户端没有这个，会在建立连接后告诉客户端投递消息的端点）
        version: 2.0.0
        instructions: "这是 sse 的方式"

