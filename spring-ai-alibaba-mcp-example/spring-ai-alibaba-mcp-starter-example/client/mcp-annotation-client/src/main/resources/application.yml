server:
  port: 19100

spring:
  application:
    name: mcp-annotation-client
  main:
    web-application-type: none
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        request-timeout: 600s
        type: ASYNC  # or ASYNC for reactive applications

        streamable-http:
          connections:
            time-server:
              url: http://localhost:20000 # 本地
        annotation-scanner:
          enabled: true
#            server2:
#              url: https://mcp.amap.com?key=xxx # 远程高德MCP服务