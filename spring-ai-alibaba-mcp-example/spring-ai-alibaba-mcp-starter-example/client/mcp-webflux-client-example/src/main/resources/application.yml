server:
  port: 8888

spring:
  application:
    name: mcp-webflux-client-example
  main:
    web-application-type: none
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
    mcp:
      client:
        sse:
          connections:
            weather-server:
              # 实际的连接地址为：http://localhost:8080/sse/weather/mcp
              url: http://localhost:8080

